<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Jaunty Roger</title>
  <meta name="description" content="The Jaunty Roger — building out and travelling in an all-electric BrightDrop 400. Coming soon.">
  <meta property="og:title" content="The Jaunty Roger">
  <meta property="og:description" content="Building out and roaming in an all-electric BrightDrop 400. Setting sail soon.">
  <meta property="og:image" content="images/dog-curious.png">
  <meta name="theme-color" content="#1f3b4d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #fbe3c4;
      --sky-bottom: #f6b98a;
      --sun: #ffd27a;
      --ink: #1f3b4d;
      --ink-soft: #46606f;
      --accent: #e0703f;
      --volt: #3fae8f;
      --road: #2b3a44;
      --line: #f4e7cf;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Sun */
    body::before {
      content: "";
      position: fixed;
      width: 46vmin;
      height: 46vmin;
      left: 50%;
      bottom: 14vh;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, var(--sun) 0%, #ffc56b 55%, rgba(255, 197, 107, 0) 72%);
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr minmax(0, 560px) 1fr;
      align-items: end;
      gap: 1rem;
      padding: 4rem 2rem 0;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .copy {
      text-align: center;
      align-self: center;
      padding-bottom: 4rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .eyebrow svg { width: 1em; height: 1em; }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: .95;
      letter-spacing: -.02em;
    }

    h1 em {
      display: block;
      font-style: italic;
      font-weight: 700;
      color: var(--accent);
      transform: rotate(-3deg);
      margin-top: .1em;
    }

    .tagline {
      margin: 1.5rem auto 0;
      max-width: 34ch;
      font-size: 1.1rem;
      line-height: 1.55;
      color: var(--ink-soft);
    }

    .badge {
      display: inline-block;
      margin-top: 2rem;
      padding: .7rem 1.4rem;
      border-radius: 999px;
      background: var(--ink);
      color: var(--line);
      font-weight: 600;
      font-size: .95rem;
      letter-spacing: .02em;
      box-shadow: 0 6px 0 rgba(31, 59, 77, .25);
    }

    .dog {
      position: relative;
      justify-self: center;
      margin: 0;
    }

    .dog img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 14px 18px rgba(31, 59, 77, .25));
      transform-origin: 50% 100%;
      transition: transform .4s cubic-bezier(.3, 1.6, .5, 1);
    }

    .dog:hover img { transform: rotate(-4deg) scale(1.03); }
    .dog--right:hover img { transform: rotate(4deg) scale(1.03); }

    .dog--left { max-width: 320px; animation: bob 5s ease-in-out infinite; }
    .dog--right { max-width: 220px; animation: bob 4.2s ease-in-out infinite .6s; }

    .dog figcaption {
      position: absolute;
      top: 8%;
      padding: .45rem .8rem;
      border-radius: 1rem;
      background: #fffaf1;
      font-size: .85rem;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(31, 59, 77, .12);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
    }

    .dog--left figcaption { right: 2%; }
    .dog--right figcaption { left: -20%; }
    .dog:hover figcaption, .dog:focus-within figcaption { opacity: 1; transform: none; }

    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -8px; }
    }

    /* Road + van */
    .road {
      position: relative;
      z-index: 2;
      height: 90px;
      background: var(--road);
      overflow: hidden;
    }

    .road::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      background: repeating-linear-gradient(90deg, var(--line) 0 40px, transparent 40px 80px);
      opacity: .7;
    }

    .van {
      position: absolute;
      bottom: 52px;
      left: 0;
      width: 140px;
      z-index: 3;
      animation: drive 22s linear infinite;
    }

    .van .wheel { transform-box: fill-box; transform-origin: center; animation: spin .6s linear infinite; }

    @keyframes drive {
      from { transform: translateX(-160px); }
      to { transform: translateX(calc(100vw + 20px)); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .scene { position: relative; }

    footer {
      position: relative;
      z-index: 2;
      background: var(--road);
      color: rgba(244, 231, 207, .6);
      text-align: center;
      font-size: .8rem;
      padding: 0 1rem 1.25rem;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr 1fr;
        padding: 3rem 1rem 0;
        align-items: end;
      }
      .copy { grid-column: 1 / -1; grid-row: 1; padding-bottom: 1rem; }
      .dog--left { max-width: 200px; }
      .dog--right { max-width: 135px; }
      .dog figcaption { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dog--left, .dog--right, .van, .van .wheel { animation: none; }
      .van { left: 50%; transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <main>
    <figure class="dog dog--left">
      <img src="images/dog-sleepy.png" alt="A small tan dog lying down with eyes squeezed shut in the sun" width="727" height="900">
      <figcaption>Chief Napping Officer</figcaption>
    </figure>

    <div class="copy">
      <p class="eyebrow">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        Coming soon
      </p>
      <h1>The <em>Jaunty Roger</em></h1>
      <p class="tagline">
        Building out and roaming the open road in an all-electric BrightDrop&nbsp;400 &mdash;
        with two very small first mates.
      </p>
      <p class="badge">Setting sail soon</p>
    </div>

    <figure class="dog dog--right">
      <img src="images/dog-curious.png" alt="A fluffy tan dog in a green harness looking up curiously" width="432" height="900">
      <figcaption>Head of Snack Security</figcaption>
    </figure>
  </main>

  <div class="scene">
    <svg class="van" viewBox="0 0 140 72" aria-hidden="true">
      <!-- body -->
      <path d="M6 10 q0-6 6-6 h88 q8 0 12 6 l16 24 q4 6 4 12 v10 q0 4-4 4 H8 q-4 0-4-4 V10z" fill="#f7f4ee"/>
      <!-- windshield -->
      <path d="M104 12 h6 l14 22 h-20z" fill="#7fb6c9"/>
      <!-- side stripe + bolt -->
      <rect x="4" y="38" width="128" height="5" fill="#3fae8f"/>
      <path d="M52 14 l-8 14 h7 l-3 10 10-15 h-7 l3-9z" fill="#e0703f"/>
      <!-- wheels -->
      <g class="wheel"><circle cx="30" cy="60" r="11" fill="#1f3b4d"/><circle cx="30" cy="60" r="4" fill="#c9d3d8"/><rect x="29" y="51" width="2" height="18" fill="#c9d3d8"/></g>
      <g class="wheel"><circle cx="108" cy="60" r="11" fill="#1f3b4d"/><circle cx="108" cy="60" r="4" fill="#c9d3d8"/><rect x="107" y="51" width="2" height="18" fill="#c9d3d8"/></g>
    </svg>
    <div class="road"></div>
  </div>

  <footer>&copy; <span id="y">2026</span> The Jaunty Roger</footer>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
